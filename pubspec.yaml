name: fajr
description: "فَجْر — تطبيق إسلامي عربي لمواقيت الصلاة والأذكار ومتابعة العبادات اليومية."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase (inert until google-services.json + a real project exist)
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.8
  firebase_messaging: ^15.2.5
  cloud_functions: ^5.3.3

  # Local storage & platform
  shared_preferences: ^2.3.5
  flutter_local_notifications: ^19.0.0
  geolocator: ^14.0.0
  url_launcher: ^6.3.1
  provider: ^6.1.5

  # Prayer times calculation
  adhan: ^2.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
